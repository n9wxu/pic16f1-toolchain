name: Release

# Pushing a tag like v0.2.0 (the VERSION file must say the same) builds and
# tests the toolchain for Linux and Windows and publishes a GitHub release
# with, for each: the toolchain archive and the VS Code extension that
# carries it (.vsix). Also the files for the PIC16F1 that every system's
# package shares, the XC8 reference binaries and the comparison report.
#
# The macOS packages are added to the release from a Mac:
#   scripts/release-macos.sh --upload v0.2.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    name: The tag is the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          [ "$GITHUB_REF_NAME" = "v$(cat VERSION)" ] || {
            echo "::error::the tag is $GITHUB_REF_NAME but VERSION says $(cat VERSION)"; exit 1; }

  toolchain:
    needs: version
    uses: ./.github/workflows/toolchain.yml

  publish:
    name: Publish release
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.vsix' -o -name 'toolchain-report.*' \) \
            -exec cp {} dist/ \;
          tar czf "dist/reference-binaries-${GITHUB_REF_NAME}.tar.gz" reference
          ls -l dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          {
            echo "## Install"
            echo
            echo "In VS Code: Extensions view > ... > **Install from VSIX...**, with the \`.vsix\` file for your system"
            echo "(or \`code --install-extension pic16f1-toolchain-$version-SYSTEM.vsix\`). It carries the whole"
            echo "toolchain. Then **PIC16F1: New Project...** in the Command Palette."
            echo
            echo "Without VS Code: unpack the \`.tar.gz\` or \`.zip\` for your system and put its \`bin\` on the PATH."
            echo
            echo "See docs/install.md."
            echo
            echo "## Compiler compared with XC8"
            echo
            cat dist/toolchain-report.md
          } > notes.md
          # The full table is long; keep the notes within GitHub's size limit.
          head -c 100000 notes.md > notes-trimmed.md && mv notes-trimmed.md notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
