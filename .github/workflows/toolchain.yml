name: Toolchain

# Builds the toolchain for Linux and for Windows and tests each.
#
# The Linux job builds clang, lld and the debugger with the PIC16F1 target,
# the runtime library, picolibc and the C++ library, builds every test
# program with them and runs the results on the simulator next to the XC8
# reference binaries, then packages the release tree. The Windows job
# builds the programs that run on Windows and packages them with the Linux
# job's files for the PIC16F1, which are the same on every system.
#
# (The macOS packages are built on a Mac with scripts/release-macos.sh:
# hosted macOS runners cost ten times a Linux one.)
#
# An LLVM build takes a long time, so this runs on request and for release
# tags rather than on every push.

on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build the Windows programs only (to try a change to that build)
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Build and test (linux-x86_64)
    # The oldest hosted Ubuntu: the programs run where the C library is
    # this one's (2.35) or newer.
    runs-on: ubuntu-22.04
    if: ${{ !inputs.windows_only }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('llvm/LLVM_VERSION') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('llvm/LLVM_VERSION') }}-

      - name: Build simulator
        run: |
          cargo build --release --locked --manifest-path sim/Cargo.toml
          cargo test --release --locked --manifest-path sim/Cargo.toml

      - name: Fetch LLVM and apply the PIC16F1 changes
        run: scripts/llvm-setup.sh

      - name: Build libxml2 for the debugger
        run: CMAKE_EXTRA="-DCMAKE_C_COMPILER_LAUNCHER=ccache" scripts/build-libxml2.sh "$PWD/build/libxml2"

      - name: Build toolchain
        run: |
          ccache --max-size=3G
          # The C++ library is linked in and the debugger uses the libxml2
          # built above and no line editor, so that the programs need
          # nothing of the system but its C library.
          export CMAKE_EXTRA="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ \
            -DLIBXML2_INCLUDE_DIR=$PWD/build/libxml2/include/libxml2 -DLIBXML2_LIBRARY=$PWD/build/libxml2/lib/libxml2.a \
            -DLLDB_ENABLE_LIBEDIT=OFF"
          NINJA_KEEP=0 scripts/build-llvm.sh
          ccache --show-stats

      # (Also of a build that failed: the next one then starts where this
      # one stopped, not from nothing.)
      - name: Save the compiler cache
        if: always() && steps.ccache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Assembler matches Microchip's encodings and round-trips
        run: scripts/test-assembler.sh build/llvm-build/bin

      - name: Regression tests
        run: python3 build/llvm-project/llvm/utils/lit/lit.py -v tests/lit

      - name: Build the test programs with the new toolchain
        env:
          PIC16F1_CC: build/toolchain/bin/pic16f1-cc
          PIC16F1_LLVM_BIN: build/toolchain/bin
        run: scripts/build-llvm-tests.sh build/out/llvm-pic16f1

      - name: Run all binaries on the simulator
        run: |
          python3 tools/bench.py --markdown toolchain-report.md --json toolchain-report.json \
            reference/xc8-v4.00 build/out/llvm-pic16f1
          cat toolchain-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: One program on every supported device
        env:
          PIC16F1_CC: build/toolchain/bin/pic16f1-cc
        run: scripts/test-devices.sh

      - name: Build picolibc and test it
        env:
          PIC16F1_CC: build/toolchain/bin/pic16f1-cc
          PIC16F1_SIM: build/toolchain/bin/pic16f1-sim
        run: |
          scripts/build-picolibc.sh build/toolchain/bin
          scripts/test-libc.sh

      - name: Build the C++ library and test it
        run: |
          scripts/build-cxx.sh
          scripts/test-cxx.sh

      - name: Compiler tests
        env:
          PIC16F1_CC: build/toolchain/bin/pic16f1-cc
          PIC16F1_LLVM_BIN: build/toolchain/bin
          TESTS_DIR: tests/compiler
        run: |
          scripts/build-llvm-tests.sh build/out/llvm-compiler-tests
          python3 tools/bench.py --programs tests/compiler --markdown compiler-tests.md \
            build/out/llvm-compiler-tests

      - name: Package
        run: |
          python=$(scripts/fetch-python.sh linux-x86_64 build/release/dl)
          python3 tools/package_release.py --platform linux-x86_64 --version "$(cat VERSION)" \
            --llvm-build build/llvm-build --sim sim/target/release/pic16f1-sim \
            --target-tree build/toolchain --python "$python" --out dist \
            --target-files-out dist/pic16f1-target-files.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-linux-x86_64
          path: |
            dist/pic16f1-toolchain-*-linux-x86_64.tar.gz
            toolchain-report.md
            toolchain-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: target-files
          path: dist/pic16f1-target-files.tar.gz

      - name: The package works with nothing else installed
        run: |
          ldd dist/linux-x86_64/pic16f1-toolchain/bin/lldb-dap dist/linux-x86_64/pic16f1-toolchain/bin/clang
          tools/test_package.sh dist/linux-x86_64/pic16f1-toolchain

      - name: Package the VS Code extension
        run: scripts/package-vsix.sh linux-x86_64 dist/pic16f1-toolchain-*-linux-x86_64.tar.gz dist

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-linux-x86_64
          path: dist/pic16f1-toolchain-*-linux-x86_64.vsix

      # In a real VS Code: the extension as it will be installed unpacks
      # its toolchain, builds a project and debugs it on the simulator.
      - name: The extension works in VS Code
        run: |
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2
          (cd vscode && npm install --no-save --no-audit --no-fund @vscode/test-electron)
          mkdir -p "$RUNNER_TEMP/vsix" && (cd "$RUNNER_TEMP/vsix" && unzip -q "$GITHUB_WORKSPACE"/dist/pic16f1-toolchain-*-linux-x86_64.vsix)
          PIC16F1_HOME="$RUNNER_TEMP/pic16f1-home" xvfb-run -a node vscode/test/run.js --extension "$RUNNER_TEMP/vsix/extension"

  windows-build:
    name: Build (windows-x86_64)
    runs-on: windows-2022
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Keep line endings as they are in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      # Git's shell has a program named link (it makes hard links) ahead
      # of Microsoft's linker on the PATH; rustc and CMake would run it.
      - name: Let link.exe be the linker
        run: mv /usr/bin/link.exe /usr/bin/link-coreutils.exe

      - name: Install build tools
        run: choco install ninja -y --no-progress

      # (sccache, not ccache as on Linux: ccache from Chocolatey reported
      # compilations done that left no object file.)
      - name: Compiler cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build simulator
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked --manifest-path sim/Cargo.toml
          cargo test --release --locked --manifest-path sim/Cargo.toml

      - name: Build the launcher of the Python drivers
        run: |
          mkdir -p build
          cl -nologo -O2 -MT -W3 toolchain/windows/launcher.c -Fo:build/launcher.obj -Fe:build/launcher.exe

      - name: Fetch LLVM and apply the PIC16F1 changes
        run: scripts/llvm-setup.sh

      - name: Build libxml2 for the debugger
        run: |
          CMAKE_EXTRA="-DCMAKE_C_COMPILER=cl -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" \
            scripts/build-libxml2.sh "$(cygpath -m "$PWD")/build/libxml2"
          ls build/libxml2/lib

      - name: Build toolchain
        env:
          # libxml2 is linked in, not a DLL: its headers must be told, and
          # its use of the system's random numbers needs bcrypt.
          # (With - and not /: Git's shell rewrites what looks like a path.)
          CL: -DLIBXML_STATIC
          LINK: bcrypt.lib
        run: |
          here=$(cygpath -m "$PWD")
          xml=$(ls build/libxml2/lib/*.lib | head -1)
          export HOST_ONLY=1
          # The C run-time library is linked in (MultiThreaded), so that
          # the programs need no Visual C++ redistributable.
          export CMAKE_EXTRA="-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DLIBXML2_INCLUDE_DIR=$here/build/libxml2/include/libxml2 -DLIBXML2_LIBRARY=$here/$xml"
          NINJA_KEEP=0 scripts/build-llvm.sh
          sccache --show-stats

      # The programs only; the next job puts them with the Linux job's
      # files for the PIC16F1. (Apart, so that this long build does not
      # wait for that one.)
      - uses: actions/upload-artifact@v4
        with:
          name: windows-programs
          retention-days: 3
          path: |
            build/llvm-build/bin/clang.exe
            build/llvm-build/bin/ld.lld.exe
            build/llvm-build/bin/llvm-mc.exe
            build/llvm-build/bin/llvm-objdump.exe
            build/llvm-build/bin/llvm-readelf.exe
            build/llvm-build/bin/llvm-objcopy.exe
            build/llvm-build/bin/llvm-ar.exe
            build/llvm-build/bin/llvm-nm.exe
            build/llvm-build/bin/llvm-size.exe
            build/llvm-build/bin/lldb.exe
            build/llvm-build/bin/lldb-dap.exe
            build/llvm-build/bin/liblldb.dll
            sim/target/release/pic16f1-sim.exe
            build/launcher.exe

  windows:
    name: Package and test (windows-x86_64)
    needs: [linux, windows-build]
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as they are in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-programs

      - uses: actions/download-artifact@v4
        with:
          name: target-files
          path: build/target

      - name: Package
        run: |
          tar -xzf build/target/pic16f1-target-files.tar.gz -C build/target
          python=$(scripts/fetch-python.sh windows-x86_64 build/release/dl)
          python tools/package_release.py --platform windows-x86_64 --version "$(cat VERSION)" \
            --llvm-build build/llvm-build --sim sim/target/release/pic16f1-sim.exe \
            --target-tree build/target/pic16f1-target-files --python "$python" \
            --launcher build/launcher.exe --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-windows-x86_64
          path: dist/pic16f1-toolchain-*-windows-x86_64.zip

      - name: The package works with nothing else installed
        run: tools/test_package.sh dist/windows-x86_64/pic16f1-toolchain

      - name: Package the VS Code extension
        run: scripts/package-vsix.sh windows-x86_64 dist/pic16f1-toolchain-*-windows-x86_64.zip dist

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-windows-x86_64
          path: dist/pic16f1-toolchain-*-windows-x86_64.vsix

      - name: The extension works in VS Code
        run: |
          (cd vscode && npm install --no-save --no-audit --no-fund @vscode/test-electron)
          mkdir -p "$RUNNER_TEMP/vsix" && (cd "$RUNNER_TEMP/vsix" && unzip -q "$GITHUB_WORKSPACE"/dist/pic16f1-toolchain-*-windows-x86_64.vsix)
          PIC16F1_HOME="$(cygpath -w "$RUNNER_TEMP/pic16f1-home")" node vscode/test/run.js --extension "$(cygpath -w "$RUNNER_TEMP/vsix/extension")"

      - name: The benchmarks, built on Windows, run as they do built on Linux
        env:
          PIC16F1_CC: dist/windows-x86_64/pic16f1-toolchain/bin/pic16f1-cc.exe
          PIC16F1_LLVM_BIN: dist/windows-x86_64/pic16f1-toolchain/bin
        run: |
          scripts/build-llvm-tests.sh build/out/llvm-pic16f1
          python tools/bench.py --sim dist/windows-x86_64/pic16f1-toolchain/bin/pic16f1-sim.exe --markdown toolchain-report.md --json toolchain-report.json \
            reference/xc8-v4.00 build/out/llvm-pic16f1
          cat toolchain-report.md >> "$GITHUB_STEP_SUMMARY"
