[package]
name = "pic16f1-sim"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 WITH LLVM-exception"
description = "Cycle-counting simulator for the PIC16F1 enhanced mid-range core"

[lib]
name = "pic16f1_sim"
path = "src/lib.rs"

[[bin]]
name = "pic16f1-sim"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
